name: PACZero main I0 validation

on:
  push:
    branches:
      - main
    paths:
      - "experiments/run-pacz-main-i0-validation-20260604.md"

permissions:
  contents: write

concurrency:
  group: pacz-main-i0-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_cell:
    name: sst2_1p3b_lora_paczpl_s1
    runs-on: self-hosted
    timeout-minutes: 355

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run validation cell and commit logs
        shell: bash
        env:
          CELL_ID: sst2_1p3b_lora_paczpl_s1
          CELL_SCRIPT: scripts/headline/sst2_1p3b_lora_paczpl_s1.sh
          LOG_SUBDIR: logs/pacz-main-i0-validation
        run: |
          set -u
          ROOT_DIR="${PWD}"
          CELL_LOG_DIR="${ROOT_DIR}/${LOG_SUBDIR}/${CELL_ID}"
          LOG_FILE="${CELL_LOG_DIR}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          LATEST_LOG="${CELL_LOG_DIR}/latest.log"
          METRICS_JSON="${CELL_LOG_DIR}/metrics.json"
          STATUS_JSON="${CELL_LOG_DIR}/status.json"
          WORK_DIR="${ROOT_DIR}/_work/${CELL_ID}/paczero"
          mkdir -p "${CELL_LOG_DIR}" "$(dirname "${WORK_DIR}")"
          run_status=0
          stage="started"

          {
            echo "PACZero main I=0 validation cell"
            echo "Cell ID: ${CELL_ID}"
            echo "Script: ${CELL_SCRIPT}"
            echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "SHA: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo
            uname -a
            command -v nvidia-smi || true
            nvidia-smi || true
            python --version
            python -m pip --version
            echo

            stage="clone"
            rm -rf "${WORK_DIR}"
            if ! git clone --depth 1 https://github.com/bilgehanertan/paczero.git "${WORK_DIR}"; then
              run_status=10
            else
              cd "${WORK_DIR}"
              echo "PACZero SHA: $(git rev-parse HEAD)"
              stage="install"
              if ! python -m pip install --upgrade pip; then
                run_status=11
              elif ! python -m pip install -r requirements.txt; then
                run_status=12
              else
                stage="run_cell"
                echo "Command: timeout 330m bash ${CELL_SCRIPT}"
                timeout 330m bash "${CELL_SCRIPT}"
                run_status=$?
                stage="collect_metrics"
                python - <<'PY'
          import glob, json, os
          cell_id = os.environ["CELL_ID"]
          out_path = os.environ["METRICS_JSON"]
          rows = []
          for path in sorted(glob.glob("result/runs/*/metrics.json")):
              run_id = os.path.basename(os.path.dirname(path))
              with open(path, "r", encoding="utf-8") as f:
                  metrics = json.load(f)
              rows.append({"cell_id": cell_id, "run_id": run_id, "metrics_path": path, "metrics": metrics})
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump({"cell_id": cell_id, "results": rows}, f, indent=2, sort_keys=True)
          print(json.dumps({"cell_id": cell_id, "results": rows}, sort_keys=True))
          PY
              fi
            fi
            stage="finished"
            echo "run_status=${run_status}"
          } 2>&1 | tee "${LOG_FILE}"

          cd "${ROOT_DIR}"
          cp "${LOG_FILE}" "${LATEST_LOG}"
          cat > "${STATUS_JSON}" <<JSON
          {
            "cell_id": "${CELL_ID}",
            "script": "${CELL_SCRIPT}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "stage": "${stage}",
            "exit_code": ${run_status},
            "completed_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON

          rm -rf "${ROOT_DIR}/_work/${CELL_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main 2>&1 | tee -a "${LOG_FILE}"
          git add "${LOG_SUBDIR}/${CELL_ID}"
          if git diff --cached --quiet; then
            push_status=0
          else
            git commit -m "Add PACZero main validation logs for ${CELL_ID} run ${GITHUB_RUN_ID}" 2>&1 | tee -a "${LOG_FILE}"
            git push 2>&1 | tee -a "${LOG_FILE}"
            push_status=${PIPESTATUS[0]}
          fi
          echo "push_status=${push_status}" | tee -a "${LOG_FILE}"
          if [ "${push_status}" -ne 0 ]; then
            exit "${push_status}"
          fi
          exit "${run_status}"
