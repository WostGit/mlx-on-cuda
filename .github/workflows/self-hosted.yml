name: Coherent End-to-End Backend Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Reset workspace
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf results llama.cpp smoke vulkan-sdk
          mkdir -p results smoke

      - name: Ultra verbose diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "# Backend Demo Diagnostics"
            echo
            echo "## Date"
            date
            echo
            echo "## Kernel"
            uname -a || true
            echo
            echo "## OS"
            lsb_release -a || true
            echo
            echo "## CPU"
            lscpu || true
            echo
            echo "## CUDA"
            nvidia-smi || true
            which nvcc || true
            nvcc --version || true
            echo
            echo "## Vulkan"
            which vulkaninfo || true
            vulkaninfo --summary || true
            echo
            echo "## glslc"
            which glslc || true
            glslc --version || true
            echo
            echo "## MLX"
            python3 -c "import mlx.core as mx; print('MLX OK', mx.default_device())" || true
            echo
            echo "## SYCL"
            set +u
            source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
            set -u
            which icpx || true
            icpx --version || true
            which sycl-ls || true
            sycl-ls || true
          } | tee results/00_diagnostics.md

      - name: Detect backend availability
        shell: bash
        run: |
          set -euxo pipefail

          CUDA_AVAILABLE=0
          VULKAN_AVAILABLE=0
          MLX_AVAILABLE=0
          SYCL_AVAILABLE=0

          if command -v nvidia-smi >/dev/null 2>&1 && command -v nvcc >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
            CUDA_AVAILABLE=1
          fi

          if command -v vulkaninfo >/dev/null 2>&1 && vulkaninfo --summary 2>&1 | grep -qi "NVIDIA\|Direct3D12"; then
            VULKAN_AVAILABLE=1
          fi

          if python3 -c "import mlx.core as mx; print(mx.default_device())" >/dev/null 2>&1; then
            MLX_AVAILABLE=1
          fi

          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          set -u
          if command -v icpx >/dev/null 2>&1; then
            SYCL_AVAILABLE=1
          fi

          {
            echo "CUDA_AVAILABLE=$CUDA_AVAILABLE"
            echo "VULKAN_AVAILABLE=$VULKAN_AVAILABLE"
            echo "MLX_AVAILABLE=$MLX_AVAILABLE"
            echo "SYCL_AVAILABLE=$SYCL_AVAILABLE"
          } | tee results/backend_availability.env

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y || true
          sudo apt-get install -y git cmake build-essential ninja-build python3-pip libvulkan-dev vulkan-tools glslang-tools spirv-tools curl tar xz-utils || true
          python3 -m pip install --user "huggingface_hub<1.0" || true

      - name: Install Vulkan SDK glslc if missing
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          if command -v glslc >/dev/null 2>&1; then
            echo "glslc already available"
            exit 0
          fi

          SDK_VERSION="1.3.296.0"
          mkdir -p vulkan-sdk
          cd vulkan-sdk
          curl -L "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz" -o sdk.tar.xz
          tar -xf sdk.tar.xz

          echo "$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Clone llama.cpp and download model
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp

          git rev-parse HEAD | tee ../results/llama_commit.txt
          git log -1 --oneline | tee ../results/llama_commit_oneline.txt

          mkdir -p models

          cat > ../smoke/download_model.py <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF",
              filename="qwen2.5-0.5b-instruct-q4_k_m.gguf",
              local_dir="models"
          )
          PY

          python3 ../smoke/download_model.py
          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_sha256.txt
          ls -lh models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_file.txt

      - name: Start GPU telemetry
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Telemetry skipped: nvidia-smi missing" | tee results/telemetry_skipped.txt
            exit 0
          fi

          (
            while true; do
              nvidia-smi \
                --query-gpu=timestamp,name,utilization.gpu,utilization.memory,memory.used,memory.total,power.draw,temperature.gpu,clocks.sm,clocks.mem \
                --format=csv,noheader,nounits
              sleep 1
            done
          ) > results/gpu_telemetry_raw.csv &

          echo $! > results/gpu_telemetry.pid

      - name: Build CUDA backend
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          source results/backend_availability.env

          if [ "$CUDA_AVAILABLE" != "1" ]; then
            echo "CUDA skipped: unavailable" | tee results/cuda_skipped.txt
            exit 0
          fi

          cd llama.cpp

          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/cuda_cmake.log

          cmake --build build-cuda --target llama-bench -j4 \
            2>&1 | tee ../results/cuda_build.log

      - name: Build Vulkan backend
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          source results/backend_availability.env

          if [ "$VULKAN_AVAILABLE" != "1" ]; then
            echo "Vulkan skipped: no NVIDIA/D3D12 Vulkan device visible" | tee results/vulkan_skipped.txt
            exit 0
          fi

          if ! command -v glslc >/dev/null 2>&1; then
            echo "Vulkan skipped: glslc missing" | tee results/vulkan_skipped.txt
            exit 0
          fi

          cd llama.cpp

          cmake -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/vulkan_cmake.log

          cmake --build build-vulkan --target llama-bench -j4 \
            2>&1 | tee ../results/vulkan_build.log

      - name: Build SYCL backend
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          source results/backend_availability.env

          if [ "$SYCL_AVAILABLE" != "1" ]; then
            echo "SYCL skipped: icpx unavailable" | tee results/sycl_skipped.txt
            exit 0
          fi

          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          set -u

          cd llama.cpp

          cmake -B build-sycl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_SYCL=ON \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/sycl_cmake.log

          cmake --build build-sycl --target llama-bench -j4 \
            2>&1 | tee ../results/sycl_build.log

      - name: Run CUDA component and full inference
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          if [ ! -x build-cuda/bin/llama-bench ]; then
            echo "CUDA run skipped: binary missing" | tee ../results/cuda_run_skipped.txt
            exit 0
          fi

          ./build-cuda/bin/llama-bench -m "$MODEL" -p 32 -n 512 -ngl 99 -o json | tee ../results/cuda_component_decode_proxy.json
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 4096 -n 0 -ngl 99 -o json | tee ../results/cuda_component_prefill_proxy.json
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 512 -n 512 -ngl 99 -o json | tee ../results/cuda_component_balanced_proxy.json
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 2048 -n 256 -ngl 99 -o json | tee ../results/cuda_full_system.json

      - name: Run Vulkan full inference
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          if [ ! -x build-vulkan/bin/llama-bench ]; then
            echo "Vulkan run skipped: binary missing" | tee ../results/vulkan_run_skipped.txt
            exit 0
          fi

          vulkaninfo --summary | tee ../results/vulkan_runtime_device.txt || true
          ./build-vulkan/bin/llama-bench -m "$MODEL" -p 2048 -n 256 -ngl 99 -o json | tee ../results/vulkan_full_system.json

      - name: Run SYCL full inference
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          set -u

          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          if [ ! -x build-sycl/bin/llama-bench ]; then
            echo "SYCL run skipped: binary missing" | tee ../results/sycl_run_skipped.txt
            exit 0
          fi

          sycl-ls | tee ../results/sycl_runtime_devices.txt || true
          ./build-sycl/bin/llama-bench -m "$MODEL" -p 2048 -n 256 -ngl 99 -o json | tee ../results/sycl_full_system.json

      - name: Run MLX component benchmark
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          cat > smoke/mlx_component_demo.py <<'PY'
          import json, platform, time
          import mlx.core as mx

          def bench(name, fn, warmup=3, iters=10):
              for _ in range(warmup):
                  y = fn()
                  mx.eval(y)
              times = []
              for _ in range(iters):
                  t0 = time.perf_counter()
                  y = fn()
                  mx.eval(y)
                  times.append(time.perf_counter() - t0)
              return {
                  "backend": "MLX",
                  "experiment": name,
                  "avg_ms": sum(times) / len(times) * 1000,
                  "min_ms": min(times) * 1000,
                  "max_ms": max(times) * 1000,
                  "iters": iters,
                  "device": str(mx.default_device()),
                  "platform": platform.platform(),
              }

          A = mx.random.normal((2048, 2048), dtype=mx.float16)
          B = mx.random.normal((2048, 2048), dtype=mx.float16)
          x = mx.random.normal((2048,), dtype=mx.float16)

          Q = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)
          K = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)
          V = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)

          def attn():
              S = Q @ mx.swapaxes(K, -1, -2)
              P = mx.softmax(S / 8.0, axis=-1)
              return P @ V

          results = [
              bench("gemm_2048_fp16", lambda: A @ B),
              bench("gemv_2048_fp16", lambda: A @ x),
              bench("attention_proxy_256", attn, warmup=2, iters=5),
          ]

          print(json.dumps(results, indent=2))
          PY

          python3 smoke/mlx_component_demo.py | tee results/mlx_component_demo.json

      - name: Run SYCL component benchmark
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          set +u
          source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          set -u

          if ! command -v icpx >/dev/null 2>&1; then
            echo "SYCL component skipped: icpx missing" | tee results/sycl_component_skipped.txt
            exit 0
          fi

          cat > smoke/sycl_component_demo.cpp <<'CPP'
          #include <sycl/sycl.hpp>
          #include <chrono>
          #include <iostream>
          #include <vector>
          using namespace sycl;

          template <typename F>
          double avg_ms(F fn, int iters) {
              auto t0 = std::chrono::high_resolution_clock::now();
              for (int i = 0; i < iters; ++i) fn();
              auto t1 = std::chrono::high_resolution_clock::now();
              return std::chrono::duration<double, std::milli>(t1 - t0).count() / iters;
          }

          int main() {
              queue q{default_selector_v};
              auto d = q.get_device();
              constexpr int N = 512;
              constexpr int ITERS = 5;
              std::vector<float> A(N*N, 1.0f), B(N*N, 1.0f), C(N*N, 0.0f), x(N, 1.0f), y(N, 0.0f);
              buffer<float, 2> a(A.data(), range<2>(N, N));
              buffer<float, 2> b(B.data(), range<2>(N, N));
              buffer<float, 2> c(C.data(), range<2>(N, N));
              buffer<float, 1> bx(x.data(), range<1>(N));
              buffer<float, 1> by(y.data(), range<1>(N));

              double gemm_ms = avg_ms([&]() {
                  q.submit([&](handler& h) {
                      accessor aa(a, h, read_only);
                      accessor bb(b, h, read_only);
                      accessor cc(c, h, write_only, no_init);
                      h.parallel_for(range<2>(N, N), [=](id<2> idx) {
                          int i = idx[0], j = idx[1];
                          float s = 0.0f;
                          for (int k = 0; k < N; ++k) s += aa[i][k] * bb[k][j];
                          cc[i][j] = s;
                      });
                  }).wait();
              }, ITERS);

              double gemv_ms = avg_ms([&]() {
                  q.submit([&](handler& h) {
                      accessor aa(a, h, read_only);
                      accessor xx(bx, h, read_only);
                      accessor yy(by, h, write_only, no_init);
                      h.parallel_for(range<1>(N), [=](id<1> idx) {
                          int i = idx[0];
                          float s = 0.0f;
                          for (int k = 0; k < N; ++k) s += aa[i][k] * xx[k];
                          yy[i] = s;
                      });
                  }).wait();
              }, ITERS);

              std::cout << "[\n";
              std::cout << "{\"backend\":\"SYCL\",\"experiment\":\"gemm_512_fp32\",\"avg_ms\":" << gemm_ms
                        << ",\"device\":\"" << d.get_info<info::device::name>() << "\",\"vendor\":\""
                        << d.get_info<info::device::vendor>() << "\"},\n";
              std::cout << "{\"backend\":\"SYCL\",\"experiment\":\"gemv_512_fp32\",\"avg_ms\":" << gemv_ms
                        << ",\"device\":\"" << d.get_info<info::device::name>() << "\",\"vendor\":\""
                        << d.get_info<info::device::vendor>() << "\"}\n";
              std::cout << "]\n";
              return 0;
          }
          CPP

          icpx -fsycl -O2 smoke/sycl_component_demo.cpp -o smoke/sycl_component_demo
          timeout 60s smoke/sycl_component_demo | tee results/sycl_component_demo.json

      - name: Stop telemetry
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f results/gpu_telemetry.pid ]; then
            kill "$(cat results/gpu_telemetry.pid)" || true
          fi
          head -5 results/gpu_telemetry_raw.csv || true
          tail -5 results/gpu_telemetry_raw.csv || true

      - name: Generate narrative report
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          cat > smoke/report.py <<'PY'
          import json, csv
          from pathlib import Path

          base = Path("results")

          llama_files = {
              "cuda_decode_proxy": "cuda_component_decode_proxy.json",
              "cuda_prefill_proxy": "cuda_component_prefill_proxy.json",
              "cuda_balanced_proxy": "cuda_component_balanced_proxy.json",
              "cuda_full_system": "cuda_full_system.json",
              "vulkan_full_system": "vulkan_full_system.json",
              "sycl_full_system": "sycl_full_system.json",
          }

          component_files = {
              "mlx_component": "mlx_component_demo.json",
              "sycl_component": "sycl_component_demo.json",
          }

          def load_json(path):
              if not path.exists():
                  return None
              text = path.read_text(errors="replace").strip()
              starts = [i for i in [text.find("["), text.find("{")] if i >= 0]
              if starts:
                  text = text[min(starts):]
              try:
                  return json.loads(text)
              except Exception:
                  return None

          def rows_from(data):
              if data is None:
                  return []
              return data if isinstance(data, list) else [data]

          def phase(r):
              p = int(r.get("n_prompt", 0) or 0)
              g = int(r.get("n_gen", 0) or 0)
              if p > 0 and g == 0:
                  return "prefill"
              if p == 0 and g > 0:
                  return "decode"
              if p > 0 and g > 0:
                  return "mixed"
              return "component"

          rows = []

          for exp, fname in llama_files.items():
              for r in rows_from(load_json(base / fname)):
                  if isinstance(r, dict):
                      rows.append({
                          "experiment": exp,
                          "backend": r.get("backends"),
                          "phase": phase(r),
                          "n_prompt": r.get("n_prompt"),
                          "n_gen": r.get("n_gen"),
                          "tokens_per_second": r.get("avg_ts"),
                          "stddev_tokens_per_second": r.get("stddev_ts"),
                          "device": r.get("gpu_info") or r.get("cpu_info"),
                          "metric": "tok/s",
                      })

          for exp, fname in component_files.items():
              for r in rows_from(load_json(base / fname)):
                  if isinstance(r, dict):
                      rows.append({
                          "experiment": r.get("experiment") or exp,
                          "backend": r.get("backend") or exp,
                          "phase": "component",
                          "n_prompt": "",
                          "n_gen": "",
                          "tokens_per_second": "",
                          "stddev_tokens_per_second": "",
                          "device": r.get("device"),
                          "metric": f"{r.get('avg_ms')} ms",
                      })

          if rows:
              with (base / "summary.csv").open("w", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows)

          telemetry = base / "gpu_telemetry_raw.csv"
          gpu_util, power, mem = [], [], []
          if telemetry.exists():
              for line in telemetry.read_text(errors="replace").splitlines():
                  parts = [x.strip() for x in line.split(",")]
                  if len(parts) >= 10:
                      try:
                          gpu_util.append(float(parts[2]))
                          mem.append(float(parts[4]))
                          power.append(float(parts[6]))
                      except Exception:
                          pass

          def avg(xs): return sum(xs) / len(xs) if xs else None
          def mx(xs): return max(xs) if xs else None
          def fmt(x):
              if x is None or x == "":
                  return "n/a"
              try:
                  return f"{float(x):,.2f}"
              except Exception:
                  return str(x)

          report = []
          report.append("# Coherent End-to-End Backend Demo Report")
          report.append("")
          report.append("## Backend availability")
          report.append("")
          if (base / "backend_availability.env").exists():
              report.append("```")
              report.append((base / "backend_availability.env").read_text(errors="replace").strip())
              report.append("```")
          report.append("")
          report.append("## Results")
          report.append("")
          report.append("| Experiment | Backend | Phase | Prompt | Generated | Throughput | Other metric | Device |")
          report.append("|---|---|---|---:|---:|---:|---:|---|")
          for r in rows:
              report.append(f"| {r['experiment']} | {r['backend']} | {r['phase']} | {r['n_prompt']} | {r['n_gen']} | {fmt(r['tokens_per_second'])} | {r['metric']} | {r['device']} |")
          report.append("")
          report.append("## Telemetry")
          report.append("")
          report.append(f"- GPU telemetry samples: {len(gpu_util)}")
          report.append(f"- Avg GPU utilization: {fmt(avg(gpu_util))}%")
          report.append(f"- Max GPU utilization: {fmt(mx(gpu_util))}%")
          report.append(f"- Avg memory used: {fmt(avg(mem))} MB")
          report.append(f"- Max memory used: {fmt(mx(mem))} MB")
          report.append(f"- Avg power draw: {fmt(avg(power))} W")
          report.append(f"- Max power draw: {fmt(mx(power))} W")
          report.append("")
          report.append("## Interpretation")
          report.append("")
          report.append("- CUDA provides the clean native RTX 4080 LLM inference baseline.")
          report.append("- Vulkan under WSL2 should be interpreted as Vulkan-Dozen/D3D12 unless native Vulkan is confirmed.")
          report.append("- SYCL currently targets the oneAPI/OpenCL CPU backend unless a GPU SYCL device appears in sycl-ls.")
          report.append("- MLX is component-level here unless an MLX-on-CUDA end-to-end model runner exists.")
          report.append("")

          (base / "DEMO_REPORT.md").write_text("\n".join(report))
          print("\n".join(report))
          PY

          python3 smoke/report.py

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-end-to-end-backend-demo-results
          path: results/
