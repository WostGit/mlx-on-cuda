name: Fast component + full-system LLM benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          set -euxo pipefail
          mkdir -p results
          date | tee results/date.txt
          uname -a | tee results/uname.txt
          nvidia-smi | tee results/nvidia.txt
          nvcc --version | tee results/nvcc.txt || true
          vulkaninfo --summary | tee results/vulkaninfo.txt || true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y git cmake build-essential ninja-build python3-pip libvulkan-dev vulkan-tools glslang-tools spirv-tools
          python3 -m pip install --user "huggingface_hub<1.0"

      - name: Clone llama.cpp
        run: |
          set -euxo pipefail
          rm -rf llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git rev-parse HEAD | tee ../results/llama_commit.txt
          git log -1 --oneline | tee ../results/llama_commit_oneline.txt

      - name: Download model
        run: |
          set -euxo pipefail
          cd llama.cpp
          mkdir -p models

          python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF",
              filename="qwen2.5-0.5b-instruct-q4_k_m.gguf",
              local_dir="models"
          )
          PY

          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_sha256.txt

      - name: Build CUDA llama-bench only
        run: |
          set -euxo pipefail
          cd llama.cpp

          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-cuda --target llama-bench -j4

      - name: CUDA component-style benchmarks
        run: |
          set -euxo pipefail
          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          echo "Small prompt/decode: proxy for decode-heavy behavior"
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 128 -n 128 -ngl 99 -o json | tee ../results/cuda_component_decode_proxy.json

          echo "Large prompt/no decode: proxy for prefill/GEMM-heavy behavior"
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 2048 -n 0 -ngl 99 -o json | tee ../results/cuda_component_prefill_proxy.json

          echo "Longer decode: proxy for KV-cache/decode stability"
          ./build-cuda/bin/llama-bench -m "$MODEL" -p 512 -n 512 -ngl 99 -o json | tee ../results/cuda_component_kv_proxy.json

      - name: CUDA full-system benchmark
        run: |
          set -euxo pipefail
          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          ./build-cuda/bin/llama-bench \
            -m "$MODEL" \
            -p 512 \
            -n 128 \
            -ngl 99 \
            -o json | tee ../results/cuda_full_inference.json

      - name: Try Vulkan build quickly
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd llama.cpp

          if ! command -v glslc >/dev/null 2>&1; then
            echo "glslc missing; Vulkan skipped" | tee ../results/vulkan_skipped.txt
            exit 0
          fi

          cmake -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-vulkan --target llama-bench -j4

      - name: Run Vulkan if available
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd llama.cpp

          if [ ! -x build-vulkan/bin/llama-bench ]; then
            echo "Vulkan binary missing; skipped" | tee ../results/vulkan_run_skipped.txt
            exit 0
          fi

          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          ./build-vulkan/bin/llama-bench \
            -m "$MODEL" \
            -p 512 \
            -n 128 \
            -ngl 99 \
            -o json | tee ../results/vulkan_full_inference.json

      - name: Summarize
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json, csv
          from pathlib import Path

          base = Path("results")

          files = {
              "cuda_decode_proxy": "cuda_component_decode_proxy.json",
              "cuda_prefill_proxy": "cuda_component_prefill_proxy.json",
              "cuda_kv_proxy": "cuda_component_kv_proxy.json",
              "cuda_full": "cuda_full_inference.json",
              "vulkan_full": "vulkan_full_inference.json",
          }

          def load_rows(path):
              if not path.exists():
                  return []
              text = path.read_text(errors="replace").strip()
              start = text.find("[")
              if start == -1:
                  start = text.find("{")
              if start > 0:
                  text = text[start:]
              data = json.loads(text)
              return data if isinstance(data, list) else [data]

          rows_out = []

          for label, fname in files.items():
              for r in load_rows(base / fname):
                  phase = "unknown"
                  if r.get("n_prompt", 0) > 0 and r.get("n_gen", 0) == 0:
                      phase = "prefill"
                  elif r.get("n_gen", 0) > 0 and r.get("n_prompt", 0) == 0:
                      phase = "decode"
                  elif r.get("n_gen", 0) > 0 and r.get("n_prompt", 0) > 0:
                      phase = "mixed"

                  rows_out.append({
                      "experiment": label,
                      "phase": phase,
                      "backend": r.get("backends"),
                      "gpu": r.get("gpu_info"),
                      "cpu": r.get("cpu_info"),
                      "n_prompt": r.get("n_prompt"),
                      "n_gen": r.get("n_gen"),
                      "tokens_per_second": r.get("avg_ts"),
                      "stddev_tokens_per_second": r.get("stddev_ts"),
                      "model": r.get("model_filename"),
                      "commit": r.get("build_commit"),
                      "test_time": r.get("test_time"),
                  })

          for row in rows_out:
              print(row)

          if rows_out:
              with (base / "summary.csv").open("w", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows_out[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows_out)
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fast-component-full-system-results
          path: results/
