name: WSL2 Vulkan Attempt

on:
  workflow_dispatch:

jobs:
  wsl2-vulkan:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Reset
        run: |
          set -euxo pipefail
          rm -rf results llama.cpp vulkan-sdk
          mkdir -p results

      - name: WSL2 diagnostics
        run: |
          set -euxo pipefail

          {
            echo "# WSL2 Vulkan Diagnostics"
            date
            uname -a
            lsb_release -a || true

            echo "## WSL check"
            grep -i microsoft /proc/version || true

            echo "## GPU / CUDA"
            nvidia-smi || true
            which nvcc || true
            nvcc --version || true

            echo "## Vulkan before SDK"
            which vulkaninfo || true
            vulkaninfo --summary || true

            echo "## WSL GPU libs"
            ls -lah /usr/lib/wsl/lib || true

            echo "## Vulkan ICD files"
            find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print -exec cat {} \; || true
          } | tee results/00_wsl2_diagnostics.md

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -y
          sudo apt-get install -y \
            git curl tar xz-utils cmake build-essential ninja-build \
            python3-pip libvulkan-dev vulkan-tools glslang-tools spirv-tools

          python3 -m pip install --user "huggingface_hub<1.0"

      - name: Install Vulkan SDK for glslc
        run: |
          set -euxo pipefail

          SDK_VERSION="1.3.296.0"
          SDK_TARBALL="vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/${SDK_TARBALL}"

          mkdir -p vulkan-sdk
          cd vulkan-sdk

          curl -L "$SDK_URL" -o "$SDK_TARBALL"
          tar -xf "$SDK_TARBALL"

          echo "$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/vulkan-sdk/${SDK_VERSION}/x86_64/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Post-SDK Vulkan check
        run: |
          set -euxo pipefail

          {
            echo "# Post-SDK Vulkan Check"

            echo "## glslc"
            which glslc || true
            glslc --version || true

            echo "## vulkaninfo"
            vulkaninfo --summary || true
          } | tee results/01_post_sdk_vulkan.md

          if vulkaninfo --summary 2>&1 | grep -qi "NVIDIA"; then
            echo "VULKAN_REAL_GPU=1" | tee results/vulkan_real_gpu.txt
          else
            echo "VULKAN_REAL_GPU=0" | tee results/vulkan_real_gpu.txt
          fi

          if vulkaninfo --summary 2>&1 | grep -qi "llvmpipe"; then
            echo "VULKAN_LLVMPIPE=1" | tee results/vulkan_llvmpipe.txt
          else
            echo "VULKAN_LLVMPIPE=0" | tee results/vulkan_llvmpipe.txt
          fi

      - name: Clone llama.cpp
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp

          git rev-parse HEAD | tee ../results/llama_commit.txt
          git log -1 --oneline | tee ../results/llama_commit_oneline.txt

      - name: Download model
        run: |
          set -euxo pipefail

          cd llama.cpp
          mkdir -p models

          python3 - <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF",
              filename="qwen2.5-0.5b-instruct-q4_k_m.gguf",
              local_dir="models"
          )
          PY

          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_sha256.txt

      - name: Build CUDA baseline
        run: |
          set -euxo pipefail

          cd llama.cpp

          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/cmake_cuda.log

          cmake --build build-cuda --target llama-bench -j4 \
            2>&1 | tee ../results/build_cuda.log

      - name: Build Vulkan backend
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd llama.cpp

          cmake -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/cmake_vulkan.log

          cmake --build build-vulkan --target llama-bench -j4 \
            2>&1 | tee ../results/build_vulkan.log

      - name: Run CUDA benchmark
        run: |
          set -euxo pipefail

          cd llama.cpp
          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          ./build-cuda/bin/llama-bench \
            -m "$MODEL" \
            -p 2048 \
            -n 256 \
            -ngl 99 \
            -o json | tee ../results/cuda_full_system.json

      - name: Run Vulkan only if real GPU is visible
        continue-on-error: true
        run: |
          set -euxo pipefail

          cd llama.cpp

          if [ ! -x build-vulkan/bin/llama-bench ]; then
            echo "Vulkan skipped: binary missing." | tee ../results/vulkan_run_skipped.txt
            exit 0
          fi

          if ! vulkaninfo --summary 2>&1 | grep -qi "NVIDIA"; then
            echo "Vulkan skipped: WSL2 exposes only llvmpipe, not NVIDIA Vulkan." | tee ../results/vulkan_run_skipped.txt
            exit 0
          fi

          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          ./build-vulkan/bin/llama-bench \
            -m "$MODEL" \
            -p 2048 \
            -n 256 \
            -ngl 99 \
            -o json | tee ../results/vulkan_full_system.json

      - name: Write conclusion
        if: always()
        run: |
          set -euxo pipefail

          {
            echo "# WSL2 Vulkan Attempt Conclusion"
            echo
            echo "This job intentionally uses only runs-on: self-hosted."
            echo
            echo "## Expected interpretation"
            echo
            echo "- If CUDA works, WSL2 GPU compute is available."
            echo "- If Vulkan builds, the Vulkan SDK / glslc problem is fixed."
            echo "- If vulkaninfo shows llvmpipe only, this is not valid NVIDIA Vulkan."
            echo "- In that case, use this as reproducibility evidence, not performance evidence."
            echo
            echo "## Status files"
            cat results/vulkan_real_gpu.txt || true
            cat results/vulkan_llvmpipe.txt || true
            cat results/vulkan_run_skipped.txt || true
          } | tee results/CONCLUSION.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsl2-vulkan-attempt-results
          path: results/
