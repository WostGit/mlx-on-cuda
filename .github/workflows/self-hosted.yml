name: Full Smoke Test - CUDA MLX SYCL

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Reset workspace
        run: |
          set -euxo pipefail
          rm -rf results llama.cpp smoke
          mkdir -p results smoke

      - name: System diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          echo "# Full Smoke Test Diagnostics" | tee results/00_system_diagnostics.md
          echo "" | tee -a results/00_system_diagnostics.md
          echo "## Date" | tee -a results/00_system_diagnostics.md
          date | tee -a results/00_system_diagnostics.md
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## Kernel" | tee -a results/00_system_diagnostics.md
          uname -a | tee -a results/00_system_diagnostics.md || true
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## OS" | tee -a results/00_system_diagnostics.md
          lsb_release -a | tee -a results/00_system_diagnostics.md || true
          sw_vers | tee -a results/00_system_diagnostics.md || true
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## CPU" | tee -a results/00_system_diagnostics.md
          lscpu | tee -a results/00_system_diagnostics.md || true
          sysctl -n machdep.cpu.brand_string | tee -a results/00_system_diagnostics.md || true
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## CUDA" | tee -a results/00_system_diagnostics.md
          nvidia-smi | tee -a results/00_system_diagnostics.md || true
          which nvcc | tee -a results/00_system_diagnostics.md || true
          nvcc --version | tee -a results/00_system_diagnostics.md || true
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## MLX" | tee -a results/00_system_diagnostics.md
          cat > smoke/check_mlx.py <<'PY'
          try:
              import mlx.core as mx
              print("MLX available")
              print(mx.default_device())
          except Exception as e:
              print("MLX unavailable:", e)
          PY
          python3 smoke/check_mlx.py | tee -a results/00_system_diagnostics.md || true
          echo "" | tee -a results/00_system_diagnostics.md

          echo "## SYCL" | tee -a results/00_system_diagnostics.md
          which icpx | tee -a results/00_system_diagnostics.md || true
          icpx --version | tee -a results/00_system_diagnostics.md || true
          which sycl-ls | tee -a results/00_system_diagnostics.md || true
          sycl-ls | tee -a results/00_system_diagnostics.md || true

      - name: Detect backends
        shell: bash
        run: |
          set -euxo pipefail

          CUDA_AVAILABLE=0
          MLX_AVAILABLE=0
          SYCL_AVAILABLE=0

          if command -v nvidia-smi >/dev/null 2>&1 && command -v nvcc >/dev/null 2>&1; then
            if nvidia-smi >/dev/null 2>&1; then
              CUDA_AVAILABLE=1
            fi
          fi

          cat > smoke/detect_mlx.py <<'PY'
          try:
              import mlx.core as mx
              print("MLX import ok")
          except Exception:
              raise SystemExit(1)
          PY

          if python3 smoke/detect_mlx.py; then
            MLX_AVAILABLE=1
          fi

          if command -v icpx >/dev/null 2>&1; then
            SYCL_AVAILABLE=1
          fi

          {
            echo "CUDA_AVAILABLE=$CUDA_AVAILABLE"
            echo "MLX_AVAILABLE=$MLX_AVAILABLE"
            echo "SYCL_AVAILABLE=$SYCL_AVAILABLE"
          } | tee results/backend_availability.env

      - name: Install common Python dependency
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user "huggingface_hub<1.0" || true

      - name: CUDA smoke test - llama.cpp
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          source results/backend_availability.env

          if [ "$CUDA_AVAILABLE" != "1" ]; then
            echo "CUDA skipped: nvidia-smi or nvcc unavailable." | tee results/cuda_skipped.txt
            exit 0
          fi

          sudo apt-get update -y || true
          sudo apt-get install -y git cmake build-essential ninja-build python3-pip || true

          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp

          git rev-parse HEAD | tee ../results/llama_commit.txt
          git log -1 --oneline | tee ../results/llama_commit_oneline.txt

          mkdir -p models

          cat > ../smoke/download_model.py <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF",
              filename="qwen2.5-0.5b-instruct-q4_k_m.gguf",
              local_dir="models"
          )
          PY

          python3 ../smoke/download_model.py

          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/cuda_model_sha256.txt

          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee ../results/cuda_cmake.log

          cmake --build build-cuda --target llama-bench -j4 \
            2>&1 | tee ../results/cuda_build.log

          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          ./build-cuda/bin/llama-bench \
            -m "$MODEL" \
            -p 512 \
            -n 128 \
            -ngl 99 \
            -o json | tee ../results/cuda_smoke_llama_bench.json

      - name: MLX smoke test
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          source results/backend_availability.env

          python3 -m venv smoke/mlx-venv
          source smoke/mlx-venv/bin/activate
          python -m pip install --upgrade pip

          if [ "$MLX_AVAILABLE" != "1" ]; then
            echo "MLX not preinstalled; trying local venv install." | tee results/mlx_install_attempt.txt
          fi

          python -m pip install mlx numpy || {
            echo "MLX skipped: install failed or platform unsupported." | tee results/mlx_skipped.txt
            exit 0
          }

          cat > smoke/mlx_smoke.py <<'PY'
          import json
          import platform
          import time
          import mlx.core as mx

          def bench(name, fn, warmup=3, iters=10):
              for _ in range(warmup):
                  y = fn()
                  mx.eval(y)
              times = []
              for _ in range(iters):
                  t0 = time.perf_counter()
                  y = fn()
                  mx.eval(y)
                  t1 = time.perf_counter()
                  times.append(t1 - t0)
              return {
                  "backend": "MLX",
                  "experiment": name,
                  "avg_ms": sum(times) / len(times) * 1000,
                  "min_ms": min(times) * 1000,
                  "max_ms": max(times) * 1000,
                  "iters": iters,
                  "platform": platform.platform(),
                  "device": str(mx.default_device()),
              }

          mx.random.seed(0)

          A = mx.random.normal((2048, 2048), dtype=mx.float16)
          B = mx.random.normal((2048, 2048), dtype=mx.float16)
          x = mx.random.normal((2048,), dtype=mx.float16)

          results = []
          results.append(bench("gemm_2048_fp16", lambda: A @ B))
          results.append(bench("gemv_2048_fp16", lambda: A @ x))

          Q = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)
          K = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)
          V = mx.random.normal((1, 8, 256, 64), dtype=mx.float16)

          def attention_proxy():
              S = Q @ mx.swapaxes(K, -1, -2)
              P = mx.softmax(S / 8.0, axis=-1)
              return P @ V

          results.append(bench("attention_proxy_256", attention_proxy, warmup=2, iters=5))

          print(json.dumps(results, indent=2))
          PY

          python smoke/mlx_smoke.py | tee results/mlx_smoke.json

      - name: SYCL smoke test
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail

          source results/backend_availability.env

          if [ "$SYCL_AVAILABLE" != "1" ]; then
            echo "SYCL skipped: icpx unavailable. Install Intel oneAPI DPC++ on this runner." | tee results/sycl_skipped.txt
            exit 0
          fi

          cat > smoke/sycl_smoke.cpp <<'CPP'
          #include <sycl/sycl.hpp>
          #include <chrono>
          #include <iostream>
          #include <vector>

          using namespace sycl;

          template <typename F>
          double avg_ms(F&& f, int iters) {
              auto t0 = std::chrono::high_resolution_clock::now();
              for (int i = 0; i < iters; ++i) {
                  f();
              }
              auto t1 = std::chrono::high_resolution_clock::now();
              return std::chrono::duration<double, std::milli>(t1 - t0).count() / iters;
          }

          int main() {
              queue q{default_selector_v};
              auto dev = q.get_device();

              constexpr int N = 512;
              constexpr int ITERS = 5;

              std::vector<float> A(N*N, 1.0f);
              std::vector<float> B(N*N, 1.0f);
              std::vector<float> C(N*N, 0.0f);

              buffer<float, 2> a(A.data(), range<2>(N, N));
              buffer<float, 2> b(B.data(), range<2>(N, N));
              buffer<float, 2> c(C.data(), range<2>(N, N));

              double gemm_ms = avg_ms([&]() {
                  q.submit([&](handler& h) {
                      accessor aa(a, h, read_only);
                      accessor bb(b, h, read_only);
                      accessor cc(c, h, write_only, no_init);

                      h.parallel_for(range<2>(N, N), [=](id<2> idx) {
                          int i = idx[0];
                          int j = idx[1];
                          float sum = 0.0f;
                          for (int k = 0; k < N; ++k) {
                              sum += aa[i][k] * bb[k][j];
                          }
                          cc[i][j] = sum;
                      });
                  }).wait();
              }, ITERS);

              std::cout << "{\n";
              std::cout << "  \"backend\": \"SYCL\",\n";
              std::cout << "  \"experiment\": \"gemm_512_fp32\",\n";
              std::cout << "  \"device\": \"" << dev.get_info<info::device::name>() << "\",\n";
              std::cout << "  \"vendor\": \"" << dev.get_info<info::device::vendor>() << "\",\n";
              std::cout << "  \"avg_ms\": " << gemm_ms << ",\n";
              std::cout << "  \"iters\": " << ITERS << "\n";
              std::cout << "}\n";
              return 0;
          }
          CPP

          icpx -fsycl -O3 smoke/sycl_smoke.cpp -o smoke/sycl_smoke
          ./smoke/sycl_smoke | tee results/sycl_smoke.json

      - name: Generate smoke summary
        shell: bash
        if: always()
        run: |
          set -euxo pipefail

          cat > smoke/generate_summary.py <<'PY'
          import json
          from pathlib import Path

          base = Path("results")

          def parse_json_file(path):
              if not path.exists():
                  return None
              text = path.read_text(errors="replace").strip()
              start = text.find("[")
              if start == -1:
                  start = text.find("{")
              if start > 0:
                  text = text[start:]
              try:
                  return json.loads(text)
              except Exception as e:
                  return {"parse_error": str(e), "raw_tail": text[-1000:]}

          cuda = parse_json_file(base / "cuda_smoke_llama_bench.json")
          mlx = parse_json_file(base / "mlx_smoke.json")
          sycl = parse_json_file(base / "sycl_smoke.json")

          report = []
          report.append("# Full Smoke Test Summary")
          report.append("")
          report.append("## Backend availability")
          if (base / "backend_availability.env").exists():
              report.append("```")
              report.append((base / "backend_availability.env").read_text(errors="replace").strip())
              report.append("```")
          report.append("")

          report.append("## CUDA")
          if cuda:
              report.append("CUDA smoke result found.")
              rows = cuda if isinstance(cuda, list) else [cuda]
              for r in rows:
                  if isinstance(r, dict):
                      phase = "prefill" if r.get("n_prompt", 0) else "decode"
                      report.append(f"- {phase}: {r.get('avg_ts')} tok/s on {r.get('gpu_info')}")
          else:
              report.append((base / "cuda_skipped.txt").read_text(errors="replace").strip() if (base / "cuda_skipped.txt").exists() else "CUDA result missing.")
          report.append("")

          report.append("## MLX")
          if mlx:
              rows = mlx if isinstance(mlx, list) else [mlx]
              for r in rows:
                  if isinstance(r, dict):
                      report.append(f"- {r.get('experiment')}: {r.get('avg_ms')} ms on {r.get('device')}")
          else:
              report.append((base / "mlx_skipped.txt").read_text(errors="replace").strip() if (base / "mlx_skipped.txt").exists() else "MLX result missing.")
          report.append("")

          report.append("## SYCL")
          if sycl:
              report.append(f"- {sycl.get('experiment')}: {sycl.get('avg_ms')} ms on {sycl.get('device')}")
          else:
              report.append((base / "sycl_skipped.txt").read_text(errors="replace").strip() if (base / "sycl_skipped.txt").exists() else "SYCL result missing.")
          report.append("")

          report.append("## Interpretation")
          report.append("- CUDA validates the NVIDIA baseline.")
          report.append("- MLX validates Apple Silicon/framework baseline when run on macOS Apple Silicon.")
          report.append("- SYCL validates performance-portability tooling when oneAPI/DPC++ is installed.")
          report.append("- This smoke test is for backend readiness, not final performance comparison.")

          out = base / "SMOKE_SUMMARY.md"
          out.write_text("\n".join(report))
          print(out.read_text())
          PY

          python3 smoke/generate_summary.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-smoke-cuda-mlx-sycl-results
          path: results/
