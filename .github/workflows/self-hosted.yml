name: Self-hosted RTX 4080 CUDA vs Vulkan benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: System diagnostics
        run: |
          set -euxo pipefail
          mkdir -p results

          date | tee results/date.txt
          uname -a | tee results/uname.txt
          lsb_release -a | tee results/os.txt || true

          echo "=== NVIDIA ===" | tee results/nvidia.txt
          nvidia-smi | tee -a results/nvidia.txt
          nvcc --version | tee results/nvcc.txt || true

          echo "=== Vulkan ===" | tee results/vulkaninfo.txt
          vulkaninfo --summary | tee -a results/vulkaninfo.txt || true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            ninja-build \
            python3-pip \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools

          python3 -m pip install --user --upgrade huggingface_hub

      - name: Clone llama.cpp
        run: |
          set -euxo pipefail
          rm -rf llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          git rev-parse HEAD | tee ../results/llama_commit.txt
          git log -1 --oneline | tee ../results/llama_commit_oneline.txt

      - name: Download model
        run: |
          set -euxo pipefail
          cd llama.cpp
          mkdir -p models results

          python3 - <<'PY'
          from huggingface_hub import hf_hub_download

          hf_hub_download(
              repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF",
              filename="qwen2.5-0.5b-instruct-q4_k_m.gguf",
              local_dir="models"
          )
          PY

          sha256sum models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_sha256.txt
          ls -lh models/qwen2.5-0.5b-instruct-q4_k_m.gguf | tee ../results/model_file.txt

      - name: Build CUDA llama-bench
        run: |
          set -euxo pipefail
          cd llama.cpp

          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-cuda --target llama-bench -j2
          ls -lh build-cuda/bin/llama-bench | tee ../results/cuda_binary.txt

      - name: Build Vulkan llama-bench
        run: |
          set -euxo pipefail
          cd llama.cpp

          which glslc
          glslc --version
          vulkaninfo --summary || true

          cmake -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build build-vulkan --target llama-bench -j2
          ls -lh build-vulkan/bin/llama-bench | tee ../results/vulkan_binary.txt

      - name: Run CUDA benchmark
        run: |
          set -euxo pipefail
          cd llama.cpp

          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          nvidia-smi

          ./build-cuda/bin/llama-bench \
            -m "$MODEL" \
            -p 512 \
            -n 128 \
            -ngl 99 \
            -o json | tee ../results/cuda.json

      - name: Run Vulkan benchmark
        run: |
          set -euxo pipefail
          cd llama.cpp

          MODEL="models/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          vulkaninfo --summary || true

          ./build-vulkan/bin/llama-bench \
            -m "$MODEL" \
            -p 512 \
            -n 128 \
            -ngl 99 \
            -o json | tee ../results/vulkan.json

      - name: Summarize results
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import json
          import csv
          from pathlib import Path

          base = Path("results")

          def load_rows(name):
              path = base / f"{name}.json"
              data = json.loads(path.read_text())
              return data if isinstance(data, list) else [data]

          def split_phases(rows):
              phases = {}
              for r in rows:
                  if r.get("n_prompt", 0) > 0:
                      phases["prefill"] = r
                  if r.get("n_gen", 0) > 0:
                      phases["decode"] = r
              return phases

          summaries = {
              "cuda": split_phases(load_rows("cuda")),
              "vulkan": split_phases(load_rows("vulkan")),
          }

          rows_out = []

          print("=== RESULTS ===")

          for backend, phases in summaries.items():
              print(f"\n{backend.upper()}")
              for phase in ["prefill", "decode"]:
                  r = phases.get(phase)
                  if not r:
                      continue

                  print(f"{phase}: {r.get('avg_ts')} tok/s")
                  print(f"  stddev: {r.get('stddev_ts')}")
                  print(f"  gpu: {r.get('gpu_info')}")
                  print(f"  backend: {r.get('backends')}")

                  rows_out.append({
                      "backend": backend,
                      "phase": phase,
                      "tokens_per_second": r.get("avg_ts"),
                      "stddev_tokens_per_second": r.get("stddev_ts"),
                      "gpu_info": r.get("gpu_info"),
                      "cpu_info": r.get("cpu_info"),
                      "backends": r.get("backends"),
                      "model": r.get("model_filename"),
                      "n_prompt": r.get("n_prompt"),
                      "n_gen": r.get("n_gen"),
                      "build_commit": r.get("build_commit"),
                      "test_time": r.get("test_time"),
                  })

          print("\n=== PORTABILITY COST: Vulkan vs CUDA ===")

          for phase in ["prefill", "decode"]:
              c = summaries["cuda"].get(phase)
              v = summaries["vulkan"].get(phase)
              if not c or not v:
                  continue

              c_perf = c.get("avg_ts")
              v_perf = v.get("avg_ts")
              ratio = v_perf / c_perf
              cost = 1.0 - ratio

              print(f"{phase}:")
              print(f"  CUDA:        {c_perf:.3f} tok/s")
              print(f"  Vulkan:      {v_perf:.3f} tok/s")
              print(f"  Vulkan/CUDA: {ratio:.3f}x")
              print(f"  Cost:        {cost * 100:.2f}%")

          with (base / "summary.csv").open("w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(rows_out[0].keys()))
              writer.writeheader()
              writer.writerows(rows_out)
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-rtx4080-cuda-vulkan-results
          path: results/
